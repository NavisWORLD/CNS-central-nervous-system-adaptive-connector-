name: Release Verification

on:
  push:
  pull_request:

jobs:
  wheel-smoke:
    name: wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Verify committed wheel checksum
        run: python -c "import hashlib,pathlib; p=pathlib.Path('dist/cns_adaptive_connector-0.1.0-py3-none-any.whl'); a=hashlib.sha256(p.read_bytes()).hexdigest(); e='0c023608ffd8817607451b9dc04efd0a7f8f6b9135ead25ebf30402d4212ff2f'; print(a); assert a==e"
      - name: Install committed wheel
        run: python -m pip install dist/cns_adaptive_connector-0.1.0-py3-none-any.whl
      - name: Run CLI status
        run: cns-bridge status
      - name: Run complete CLI cycle
        run: cns-bridge demo --prompt "release certification smoke test" --json
      - name: Verify public Python contract
        run: python -c "from cns_bridge import CNSHarness,SensorySnapshot; h=CNSHarness(seed=707); r=h.run_step('certify',SensorySnapshot(audio_rms=.2,dominant_frequency_hz=220,arousal=.4),{'coherence':.8}); assert r.packet.sensory_12d.shape==(12,); assert r.packet.context_42d.shape==(42,); assert r.packet.adaptive_54d.shape==(54,); assert r.response; assert h.plasticity.updates==1; assert len(h.memory)==1; print('CNS WHEEL CONTRACT PASS')"
